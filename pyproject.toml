[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock"
version = "0.1.0"
description = "A production-grade Python CLI Alarm Clock using standard library primitives"
authors = [
    { name = "Senior Software Engineer Assessment" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
alarm-clock = "alarm_clock.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
